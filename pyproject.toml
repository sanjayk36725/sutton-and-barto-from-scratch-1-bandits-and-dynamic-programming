[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutton-barto-from-scratch-1"
version = "1.0.0"
description = "From-scratch implementations of bandits and dynamic programming"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
